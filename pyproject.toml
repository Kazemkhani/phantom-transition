[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-transition"
version = "1.1.0"
description = "A reproduction and fix for phantom phase transitions in interruptible multi-agent voice systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amir Hossein Kazemkhani", email = "amir@amirkazemkhani.com" }]
keywords = ["voice-ai", "multi-agent", "llm-agents", "barge-in", "ai-safety"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# The adapter in `phantom_transition.livekit`. The core package has no runtime
# dependencies and never imports livekit.agents at module scope, so this extra
# is only needed to run a guarded agent, not to import or test the guard.
livekit = ["livekit-agents>=1.7,<2"]

[project.urls]
Homepage = "https://amirkazemkhani.com"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]
