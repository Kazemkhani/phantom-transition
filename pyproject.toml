[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-transition"
version = "1.1.0"
description = "A reproduction and fix for phantom phase transitions in interruptible multi-agent voice systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amir Hossein Kazemkhani", email = "amir@amirkazemkhani.com" }]
keywords = ["voice-ai", "multi-agent", "llm-agents", "barge-in", "ai-safety"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "hypothesis>=6.100"]

[project.urls]
Homepage = "https://amirkazemkhani.com"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mutmut]
paths_to_mutate = [ "src/phantom_transition/" ]
tests_dir = [ "tests/" ]
