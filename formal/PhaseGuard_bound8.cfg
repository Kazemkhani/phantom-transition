\* The guarded session at a bound of eight turns. Within four turns the
\* guarded session cannot reach PITCH (two discovery answers need a greeting
\* turn, an advance and two answer turns first), so the four-turn bound never
\* exercises the PITCH or CLOSE gates on the legitimate path. Eight turns
\* reaches CLOSE with two adversarial turns to spare.
SPECIFICATION Spec
CONSTANTS
    PreemptiveGeneration = TRUE
    CancelOnInterrupt = TRUE
    GuardEnabled = TRUE
    RecordOnInterrupt = FALSE
    MaxTurns = 8
    Forged = Forged
INVARIANTS
    TypeOK
    NoBackwardMove
    AtMostOneStep
    InterruptedTurnsAreInert
    EntryConditionRespected
    GroundedTransition
    InterruptedTurnsWriteNoFacts
    PitchRecordsItsDelivery
