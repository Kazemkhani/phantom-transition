\* The same M3 mutant checked against only the four original invariants of
\* the notebook and test_12, over the full eight-turn behaviour space. TLC
\* finding no error here is the point: the four invariants are conditions
\* over the phase and the facts record, M3 corrupts the record itself, and
\* so no bound and no alphabet can make them see it. The published suite's
\* enumeration inherits exactly this blindness, which is why the M3 source
\* mutant passes all 24 tests (results/core-v2 in the research hub).
SPECIFICATION Spec
CONSTANTS
    PreemptiveGeneration = TRUE
    CancelOnInterrupt = TRUE
    GuardEnabled = TRUE
    RecordOnInterrupt = TRUE
    MaxTurns = 8
    Forged = Forged
INVARIANTS
    NoBackwardMove
    AtMostOneStep
    InterruptedTurnsAreInert
    EntryConditionRespected
