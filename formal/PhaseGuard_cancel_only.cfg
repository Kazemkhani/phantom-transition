\* Fix one alone: Session(preemptive_generation=True,
\* cancel_handoff_on_interrupt=True, guard_enabled=False). Cancellation
\* restores the phase after a barge-in but is not an admission check, so the
\* entry-condition and one-step invariants still fail.
SPECIFICATION Spec
CONSTANTS
    PreemptiveGeneration = TRUE
    CancelOnInterrupt = TRUE
    GuardEnabled = FALSE
    MaxTurns = 4
    Forged = Forged
INVARIANTS
    TypeOK
    InterruptedTurnsAreInert
    NoBackwardMove
    AtMostOneStep
    EntryConditionRespected
    GroundedTransition
