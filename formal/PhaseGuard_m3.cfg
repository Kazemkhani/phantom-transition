\* The M3 mutant at the specification level: guard on, cancellation on,
\* pre-emptive generation on, but facts recorded on interrupted turns too
\* (RecordOnInterrupt). The fifth invariant catches it; TLC prints the
\* trace: an interrupted turn whose facts record changed.
SPECIFICATION Spec
CONSTANTS
    PreemptiveGeneration = TRUE
    CancelOnInterrupt = TRUE
    GuardEnabled = TRUE
    RecordOnInterrupt = TRUE
    MaxTurns = 4
    Forged = Forged
INVARIANTS
    TypeOK
    NoBackwardMove
    AtMostOneStep
    InterruptedTurnsAreInert
    EntryConditionRespected
    GroundedTransition
    InterruptedTurnsWriteNoFacts
