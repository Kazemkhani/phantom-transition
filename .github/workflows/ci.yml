name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the suite
        run: pytest -v

      - name: Run the suite with assertions stripped
        run: python -O -m pytest -q

  adapter:
    name: LiveKit adapter (livekit-agents 1.7.x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install with the livekit extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,livekit]"

      - name: Report the resolved version
        run: python -c "import livekit.agents; print(livekit.agents.__version__)"

      - name: Run the suite
        # Nothing may be skipped here: the tests marked
        # pytest.importorskip("livekit.agents") are the ones this job exists to run.
        run: pytest -v -rs --strict-markers
